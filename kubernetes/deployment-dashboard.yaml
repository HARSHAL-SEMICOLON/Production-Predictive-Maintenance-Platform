apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-dashboard-deployment
  labels:
    app.kubernetes.io/name: sentinel-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-dashboard
  template:
    metadata:
      labels:
        app: sentinel-dashboard
    spec:
      containers:
        - name: sentinel-dashboard
          image: harshal/sentinel-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://sentinel-api-service:8000"
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-dashboard-service
  labels:
    app.kubernetes.io/name: sentinel-dashboard
spec:
  type: NodePort
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30501
  selector:
    app: sentinel-dashboard
