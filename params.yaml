# Sentinel AI Pipeline Hyperparameters
prepare:
  dataset: FD001
  clip_rul: 125

features:
  window_size: 30
  rolling_windows: [5, 10, 20]
  lags: [1, 3, 5]

train:
  xgboost:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
  lstm:
    epochs: 25
    batch_size: 64
    lstm_units: 64
    dropout: 0.2
    learning_rate: 0.001

evaluate:
  critical_threshold: 30
  warning_threshold: 75
